# XcodeGen spec for the Fort Apple clients. Generate the project with:
#   cd ui/apple && xcodegen generate
# then open Fort.xcodeproj. The generated .xcodeproj is git-ignored (regenerable
# from this spec). All targets depend on the local FortKit Swift package.
#
# Shipping shape: the iOS app (Fort) embeds the watchOS app (FortWatch), which in
# turn embeds the complication (FortComplication) — so one TestFlight iOS build
# delivers phone + watch + complication. FortMac ships as its own record.
name: Fort
options:
  bundleIdPrefix: io.mtree
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
    watchOS: "10.0" # widget-preview macros (#Preview(as:)) require watchOS 10

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # For TestFlight: set DEVELOPMENT_TEAM here (or enable automatic signing per
    # target in Xcode). Compile/CI verification passes CODE_SIGNING_ALLOWED=NO on
    # the xcodebuild command line, so the project itself stays sign-able.
    DEVELOPMENT_TEAM: T3JB5MYZ93 # Maple Tree Enterprises LLC

packages:
  FortKit:
    path: FortKit

targets:
  # iOS app — Board / Gates / Feed tabs. Embeds the watch app, and includes the
  # CarPlay scene delegate (compiles; running CarPlay needs Apple's entitlement).
  Fort:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["*.md"]
      - path: CarPlay/FortCarPlaySceneDelegate.swift
    dependencies:
      - package: FortKit
      - target: FortWatch
        embed: true # deliver the watch app inside the iOS app
    info:
      path: Support/Fort-iOS-Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false # standard networking only
        # App Store validation: orientations are required (all four for iPad
        # multitasking).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow http to LAN / .local hosts (the control plane), without fully
        # disabling ATS. Point the app at your host via the Settings screen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # CarPlay scene. SwiftUI still provides the phone window scene; this only
        # adds the CarPlay role. Inert until the CarPlay entitlement is granted
        # (see docs/notes/testflight.md) — remove this block to ship without it.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: FortCarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).FortCarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mtree.fort
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # macOS menu-bar app (LSUIElement — no dock icon). Ships as its own record.
  FortMac:
    type: application
    platform: macOS
    sources:
      - path: macOS
        excludes: ["*.md"]
    dependencies:
      - package: FortKit
    info:
      path: Support/FortMac-Info.plist
      properties:
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mtree.fort.mac

  # watchOS app — glance + gate quick-approve. Embedded in the iOS app; embeds
  # the complication. Its bundle id is a child of the iOS app id.
  FortWatch:
    type: application
    platform: watchOS
    sources:
      - path: watch/FortWatchApp.swift
      - path: watch/GlanceView.swift
      - path: watch/Assets.xcassets
    dependencies:
      - package: FortKit
      - target: FortComplication
        embed: true
    info:
      path: Support/FortWatch-Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.mtree.fort # pair with the iOS app
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mtree.fort.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # watchOS WidgetKit complication (pending-gate count).
  FortComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: watch/FortComplication.swift
      - path: Support/FortComplicationBundle.swift
    dependencies:
      - package: FortKit
    info:
      path: Support/Complication-Info.plist
      properties:
        CFBundleDisplayName: Fort # required by App Store validation
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # NOTE: io.mtree.fort.watch.complication is unavailable (App ID taken,
        # Apple 409) — hence .widgets.
        PRODUCT_BUNDLE_IDENTIFIER: io.mtree.fort.watch.widgets
