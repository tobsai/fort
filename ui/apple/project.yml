# XcodeGen spec for the Fort Apple clients. Generate the project with:
#   cd ui/apple && xcodegen generate
# then open Fort.xcodeproj. The generated .xcodeproj is git-ignored (regenerable
# from this spec). Both shipping targets depend on the local FortKit Swift
# package. Phase 1 ships only the iPhone and Mac Primary Channels surfaces.
name: Fort
options:
  bundleIdPrefix: io.mtree
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"

settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "2608092"
    SWIFT_VERSION: "5.0"
    # Set to the deployed HTTPS gateway origin for a pre-filled native sign-in URL.
    # Users can still enter it in Connection Settings when this is empty.
    FORT_GATEWAY_URL: "https://fort-gateway.vercel.app"
    # For TestFlight: set DEVELOPMENT_TEAM here (or enable automatic signing per
    # target in Xcode). Compile/CI verification passes CODE_SIGNING_ALLOWED=NO on
    # the xcodebuild command line, so the project itself stays sign-able.
    DEVELOPMENT_TEAM: T3JB5MYZ93 # Maple Tree Enterprises LLC

packages:
  FortKit:
    path: FortKit

targets:
  # iOS app — Phase 1 Primary Channels only. Keep this source list explicit so
  # dormant Command Deck or constrained-surface files cannot enter the archive.
  Fort:
    type: application
    platform: iOS
    sources:
      - path: iOS/FortApp.swift
      - path: iOS/GatewayCoordinator.swift
      - path: iOS/Assets.xcassets
    dependencies:
      - package: FortKit
    info:
      path: Support/Fort-iOS-Info.plist
      properties:
        # Follow the build settings (settings.base) instead of xcodegen's literal
        # "1.0"/"1" defaults, so a project.yml version bump reaches the built app
        # and TestFlight sees the new build.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false # standard networking only
        FortGatewayURL: "$(FORT_GATEWAY_URL)"
        CFBundleURLTypes:
          - CFBundleURLName: io.mtree.fort.gateway-auth
            CFBundleURLSchemes:
              - fort
        # App Store validation: orientations are required (all four for iPad
        # multitasking).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mtree.fort
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Windowed macOS Primary Channels app with a bounded MenuBarExtra glance.
  FortMac:
    type: application
    platform: macOS
    sources:
      - path: macOS/FortMacApp.swift
      - path: macOS/MenuContent.swift
      - path: macOS/Assets.xcassets
    dependencies:
      - package: FortKit
    info:
      path: Support/FortMac-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Windowed app (not menu-bar-only): a Dock icon + the Fort window opens on
        # launch, so double-clicking the app shows the dashboard. The MenuBarExtra
        # still appears in the menu bar for glances. (Was LSUIElement: true, which
        # hid the Dock icon AND kept the window closed → "clicking it did nothing".)
        LSUIElement: false
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mtree.fort.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES

  FortMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: macOSUITests
    dependencies:
      - target: FortMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mtree.fort.mac.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FortMac:
    build:
      targets:
        FortMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: FortMacUITests
