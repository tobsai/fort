name: Fort quality

on:
  pull_request:
  # Railway deploys the hub from main. With "Wait for CI" on in the hub's service settings, a deploy
  # waits for this workflow on the merged commit and is skipped if it fails.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fort-quality-${{ github.ref }}
  # Never cancel a run on main: Railway blocks a deploy whose only workflow run was cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.native == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          # One process, so pipefail can't turn an early grep -q exit into "no changes".
          if awk '/^(successor\/|\.github\/workflows\/)/ && !/\.md$/ { found = 1 } END { exit !found }' "$RUNNER_TEMP/changed.txt"; then
            echo native=true >> "$GITHUB_OUTPUT"
          else
            echo native=false >> "$GITHUB_OUTPUT"
          fi

  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - run: npm --prefix successor ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix successor run typecheck
      - run: npm --prefix successor test

  # The web half of the side-by-side screenshots: the real web client against a mock hub serving
  # design/screens/fixture.json. Pictures for review, not a gate.
  screens:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.5.0
          package-manager-cache: false
      # Playwright drives the Google Chrome the runner image already has, so no browser download.
      - name: Install Playwright
        timeout-minutes: 3
        run: npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund playwright@1.55.0
      - name: Draw the web screenshots
        timeout-minutes: 4
        shell: bash
        run: |
          google-chrome --version
          ln -s "$RUNNER_TEMP/playwright/node_modules" successor/design/screens/node_modules
          FORT_CHROME_CHANNEL=chrome node successor/design/screens/web-screens.mjs "$RUNNER_TEMP/fort-screens"
          node successor/design/screens/print-screens.mjs "$RUNNER_TEMP/fort-screens"

  # Builds the image Railway deploys and checks that the hub starts and answers, so a file the
  # Dockerfile doesn't copy fails here instead of on fort.mtree.io.
  hub-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build --tag fort-hub:ci successor
      - name: Start the hub and wait for it to answer
        shell: bash
        run: |
          docker run --detach --name fort-hub --publish 127.0.0.1:8080:8080 --tmpfs /data:mode=0700 \
            --env FORT_NODE=ci-mac --env FORT_PROVIDER=codex --env FORT_RUNTIME_VERSION=0.163.0 fort-hub:ci
          for attempt in $(seq 1 30); do
            if reply=$(curl -fsS http://127.0.0.1:8080/auth/session) && [ "$reply" = '{"google":false}' ]; then echo "Hub answered: $reply"; exit 0; fi
            sleep 1
          done
          docker logs fort-hub
          exit 1
      - if: always()
        run: docker rm --force fort-hub || true

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - run: npm --prefix successor ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix successor run test:macos
      - name: Prepare synthetic native host fixtures
        shell: bash
        run: |
          xcrun swiftc successor/host/mac-process-guardian.swift -o "$RUNNER_TEMP/fort-guardian"
          node successor/packaging/host-resources.ts --destination "$RUNNER_TEMP/fort-host-resources" > "$RUNNER_TEMP/fort-host-manifest.json"
          echo "FORT_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "FORT_TEST_GUARDIAN=$RUNNER_TEMP/fort-guardian" >> "$GITHUB_ENV"
          echo "FORT_TEST_CORE_ARTIFACT=$RUNNER_TEMP/fort-host-resources/core" >> "$GITHUB_ENV"
          echo "FORT_TEST_HOST_RESOURCES=$RUNNER_TEMP/fort-host-resources" >> "$GITHUB_ENV"
      - run: xcrun swift test --package-path successor/apple/FortKit --scratch-path "$RUNNER_TEMP/fort-swift" --no-parallel
      # The Mac half of the web/Mac side-by-side screenshots (design/screens). Pictures for review, not a gate.
      - name: Draw the Mac screenshots
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          export FORT_SCREENSHOTS="$RUNNER_TEMP/fort-screens"
          xcrun swift test --package-path successor/apple/FortKit --scratch-path "$RUNNER_TEMP/fort-swift" --no-parallel --filter ScreenshotTests
          for png in "$FORT_SCREENSHOTS"/*.png; do sips -s format jpeg -s formatOptions 80 "$png" --out "${png%.png}.jpg" > /dev/null && rm "$png"; done
          node successor/design/screens/print-screens.mjs "$FORT_SCREENSHOTS"
      - name: Verify compiled native HTTP journeys
        shell: bash
        run: |
          xcrun swift build --package-path successor/apple/FortKit --scratch-path "$RUNNER_TEMP/fort-swift" --product FortNativeCheck
          swift_bin="$(xcrun swift build --package-path successor/apple/FortKit --scratch-path "$RUNNER_TEMP/fort-swift" --show-bin-path)"
          node successor/apple/native-http-check.ts "$swift_bin/FortNativeCheck"
          node successor/apple/openai-http-check.ts "$swift_bin/FortNativeCheck"
