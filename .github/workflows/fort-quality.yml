name: Fort quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      review_base:
        description: Trusted full commit SHA for the reviewed comparison
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fort-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - run: npm --prefix successor ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix successor run test:specs
      - run: npm --prefix successor run test:reviews
      - name: Check required review evidence
        env:
          FORT_REVIEW_BASE: ${{ github.event.pull_request.base.sha || inputs.review_base }}
        run: node ops/architecture/validate-reviews.mjs --base "$FORT_REVIEW_BASE"
      - run: node ops/architecture/validate-specs.mjs --implementation specs/059-modular-node-v1.md
      - run: npm --prefix successor run typecheck
      - run: npm --prefix successor test

  native:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.5.0
          package-manager-cache: false
      - run: npm --prefix successor ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix successor run check:specs
      - run: npm --prefix successor run test:macos
      - name: Prepare synthetic native host fixtures
        shell: bash
        run: |
          xcrun swiftc successor/host/mac-process-guardian.swift -o "$RUNNER_TEMP/fort-guardian"
          node successor/packaging/host-resources.ts --destination "$RUNNER_TEMP/fort-host-resources" > "$RUNNER_TEMP/fort-host-manifest.json"
          echo "FORT_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "FORT_TEST_GUARDIAN=$RUNNER_TEMP/fort-guardian" >> "$GITHUB_ENV"
          echo "FORT_TEST_CORE_ARTIFACT=$RUNNER_TEMP/fort-host-resources/core" >> "$GITHUB_ENV"
          echo "FORT_TEST_HOST_RESOURCES=$RUNNER_TEMP/fort-host-resources" >> "$GITHUB_ENV"
      - run: xcrun swift test --package-path successor/apple/FortKit --scratch-path "$RUNNER_TEMP/fort-swift"
      - name: Verify compiled native HTTP journeys
        shell: bash
        run: |
          xcrun swift build --package-path successor/apple/FortKit --scratch-path "$RUNNER_TEMP/fort-swift" --product FortNativeCheck
          swift_bin="$(xcrun swift build --package-path successor/apple/FortKit --scratch-path "$RUNNER_TEMP/fort-swift" --show-bin-path)"
          node successor/apple/native-http-check.ts "$swift_bin/FortNativeCheck"
          node successor/apple/openai-http-check.ts "$swift_bin/FortNativeCheck"
