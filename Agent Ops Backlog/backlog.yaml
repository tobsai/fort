# Agent Ops — machine-readable backlog (rev. 2: Fort-native, one project)
# Canonical copy for ingestion into a tracker or as a Fort flow seed.
# Keep IDs stable. estimate: S<=0.5d, M=1-2d, L=3-5d, XL=>1wk/spike. status: todo|in-progress|done|wontfix.
meta:
  project: fort
  revision: 2
  created: 2026-06-30
  owner: toby
  spec: ../mtree - Agent Ops - Build vs Buy Analysis & Spec.md
  architecture: one repo, three modules - fort-core (orchestration), fort-exec (native execution), fort-ui (interface)
  references_not_components: [multica, agent-portal, postern]
  estimate_legend: { S: "<=0.5d", M: "1-2d", L: "3-5d", XL: ">1wk or spike" }
  routing:               # label -> agent (mirrors Fort's v1 ruleset, AO-017)
    dev: codex
    design: claude-code
    chat: claude-code
    errand: openclaw
    research: hermes
    spike: hermes
    decision: human

tickets:
