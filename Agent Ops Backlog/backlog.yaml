    phase: 0
    type: task
    priority: P0
    estimate: S
    labels: [errand]
    routes_to: openclaw
    depends_on: []
    status: todo
    acceptance:
      - Each CLI can call its provider headless
      - No keys committed; .env.example documents required vars
  - id: AO-006
