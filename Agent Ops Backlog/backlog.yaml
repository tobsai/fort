    type: task
    priority: P0
    estimate: M
    labels: [dev]
    routes_to: codex
    depends_on: [AO-090]
    status: todo
    acceptance:
      - Repo builds; core/exec/ui/rules/flows/cmd/docs modules exist
      - Module boundaries enforced (core cannot import ui; core->exec only via Runtime)
  - id: AO-002
    title: Runtime recon - drive each CLI headless
    phase: 0
    type: spike
    priority: P0
    estimate: M
    labels: [spike]
    routes_to: hermes
    depends_on: []
    status: todo
    key: true
    acceptance:
      - docs/notes/runtime-recon.md documents command/streaming/stdin/exit per CLI
      - A script runs one real task on each of the four CLIs headless
  - id: AO-003
    title: Study Multica's Apache-2.0 daemon; decide what to vendor
    phase: 0
    type: spike
    priority: P0
    estimate: M
    labels: [spike]
    routes_to: hermes
    depends_on: []
    status: todo
    key: true
    acceptance:
      - docs/notes/multica-daemon.md with borrow/skip decision per component + attribution plan
      - AO-014 re-estimated against the decision
  - id: AO-004
    title: Extract fort-ui contracts from Agent Portal/Postern
    phase: 0
    type: spike
    priority: P1
    estimate: M
    labels: [spike]
    routes_to: hermes
    depends_on: []
    status: todo
    acceptance:
