      "script": "#!/bin/sh\nset -eu\nexport PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C\nfail() { systemctl --no-block poweroff; exit 1; }\ncommand -v nft >/dev/null || fail\n# Replace our table in one nft transaction; leave other tables untouched.\n{ if nft list table inet fort_probe >/dev/null 2>&1; then\n    printf 'delete table inet fort_probe\\n'\n  fi\n  cat <<'FORT_NFT'\ntable inet fort_probe {\n  chain input {\n    type filter hook input priority -100; policy drop;\n    iifname \"lo\" accept\n    ct state established,related accept\n    iifname \"eth0\" ip saddr 192.168.5.2 udp sport 67 udp dport 68 accept\n    iifname \"eth0\" ip saddr 192.168.5.2 tcp dport 22 ct state new accept\n  }\n  chain output {\n    type filter hook output priority -100; policy drop;\n    oifname \"lo\" accept\n    ct state established,related accept\n    oifname \"eth0\" ip daddr { 192.168.5.2, 255.255.255.255 } udp sport 68 udp dport 67 accept\n  }\n  chain forward {\n    type filter hook forward priority -100; policy drop;\n  }\n}\nFORT_NFT\n} | nft -f - || fail\n"
