name: FortSpec058
options:
  bundleIdPrefix: io.fort.spec058
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  FortKit:
    path: FortKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Fort Fixture
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FortiOS:
    type: application
    platform: iOS
    sources: [Apps]
    dependencies:
      - package: FortKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fort.spec058.fixture.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  FortMac:
    type: application
    platform: macOS
    sources: [Apps]
    dependencies:
      - package: FortKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fort.spec058.fixture.mac
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
schemes:
  FortiOS:
    build:
      targets:
        FortiOS: all
  FortMac:
    build:
      targets:
        FortMac: all
