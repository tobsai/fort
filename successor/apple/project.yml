name: FortSpec058
options:
  bundleIdPrefix: io.fort.spec058
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  FortKit:
    path: FortKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "DEVELOPMENT_TEAM[sdk=iphonesimulator*]": ""
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Fort Fixture
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FortHost:
    type: application
    platform: macOS
    sources: [Host]
    dependencies:
      - package: FortKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fort.spec058.fixture.mac.host
        INFOPLIST_KEY_CFBundleDisplayName: Fort Host
        INFOPLIST_KEY_LSBackgroundOnly: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
  FortiOS:
    type: application
    platform: iOS
    sources: [Apps]
    dependencies:
      - package: FortKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fort.spec058.fixture.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  FortMac:
    type: application
    platform: macOS
    sources: [Apps]
    dependencies:
      - package: FortKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fort.spec058.fixture.mac
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
  FortQA:
    type: application
    platform: macOS
    sources: [Apps]
    dependencies:
      - package: FortKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fort.qa.firstwave.20261017
        PRODUCT_NAME: FortQA
        INFOPLIST_KEY_CFBundleDisplayName: Fort QA First Wave
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FORT_INTERACTIVE_QA"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG FORT_INTERACTIVE_QA"
  FortiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FortiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fort.spec058.fixture.ios.uitests
        TEST_TARGET_NAME: FortiOS
  FortMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: FortMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fort.spec058.fixture.mac.uitests
        TEST_TARGET_NAME: FortMac
schemes:
  FortHost:
    build:
      targets:
        FortHost: all
  FortiOS:
    build:
      targets:
        FortiOS: all
    test:
      targets: [FortiOSUITests]
  FortMac:
    build:
      targets:
        FortMac: all
    test:
      targets: [FortMacUITests]
  FortQA:
    build:
      targets:
        FortQA: all
